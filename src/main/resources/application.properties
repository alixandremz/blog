spring.application.name=blog

# H2 em memória (some ao reiniciar); troque por Postgres para persistir
spring.datasource.url=jdbc:h2:mem:blog;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# loga o SQL para você enxergar (e contar) as consultas e ver o N+1
spring.jpa.show-sql=true

# console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
